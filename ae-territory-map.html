<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AE Territory Map · Findigs</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    /* ── Findigs Design Tokens ── */
    :root {
      --brand-key-green: #9BFF6A;
      --brand-forest:    #212b14;
      --brand-sand:      #fdfbf7;
      --brand-sky:       #add2ff;
      --brand-sun:       #ffce59;
      --brand-coral:     #ffa27a;
      --brand-berry:     #f3b3f1;

      --bg:        #151a0f;
      --surface:   #1a2112;
      --surface-2: #222b18;
      --surface-3: #2c3720;
      --border:    #3a4530;

      --text:       #f0f1ec;
      --text-muted: #999894;
      --text-dim:   #666563;

      --accent:    #9BFF6A;
      --accent-2:  #ADD2FF;
      --accent-3:  #FFD56A;
      --red:       #ef4444;
      --red-dim:   rgba(239,68,68,0.12);
      --amber-dim: rgba(255,213,106,0.10);
      --green-dim: rgba(155,255,106,0.10);

      --radius: 16px;
      --shadow: 0 10px 22px rgba(0,0,0,0.28);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Ambient glow ── */
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient::before {
      content: ''; position: absolute; top: -20%; left: -5%;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(155,255,106,0.055) 0%, transparent 68%);
      animation: drift 22s ease-in-out infinite;
    }
    .ambient::after {
      content: ''; position: absolute; bottom: -20%; right: -5%;
      width: 580px; height: 580px;
      background: radial-gradient(circle, rgba(173,210,255,0.045) 0%, transparent 68%);
      animation: drift 28s ease-in-out infinite reverse;
    }
    @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(55px,35px)} }

    /* ── Layout ── */
    .page { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(21,26,15,0.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }

    .logo-mark {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    .header-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.4px;
    }
    .header-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ── Toggle ── */
    .toggle-group {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 3px;
    }
    .toggle-btn {
      padding: 8px 24px;
      border: none;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s ease;
      color: var(--text-muted);
      background: transparent;
      letter-spacing: 0.1px;
    }
    .toggle-btn.active {
      background: var(--accent);
      color: var(--brand-forest);
      box-shadow: 0 2px 8px rgba(155,255,106,0.3);
    }
    .toggle-btn:hover:not(.active) {
      color: var(--text);
      background: var(--surface-3);
    }

    /* ── Main body ── */
    .main {
      display: flex;
      gap: 18px;
      padding: 20px 32px 28px;
      flex: 1;
      align-items: flex-start;
    }

    /* ── Map card ── */
    .map-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 22px 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .map-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .map-card-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .map-card-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .new-state-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--green-dim);
      border: 1px solid rgba(155,255,106,0.2);
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    svg#map { width: 100%; height: auto; display: block; }

    .state {
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .state:hover { opacity: 0.72; }

    /* ── Sidebar ── */
    .sidebar { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--text-dim);
      margin-bottom: 13px;
    }

    /* ── Legend ── */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .legend-item:last-child { border-bottom: none; padding-bottom: 0; }
    .legend-swatch {
      width: 16px; height: 16px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .legend-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .legend-role {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .legend-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-3);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* ── Change badges ── */
    .change-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .change-row:last-child { border-bottom: none; }
    .change-label { color: var(--text-muted); font-weight: 500; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }
    .badge-add    { background: var(--green-dim); color: var(--accent); border: 1px solid rgba(155,255,106,0.2); }
    .badge-change { background: var(--amber-dim); color: var(--accent-3); border: 1px solid rgba(255,213,106,0.2); }
    .badge-keep   { background: rgba(173,210,255,0.08); color: var(--accent-2); border: 1px solid rgba(173,210,255,0.18); }

    /* ── Stats ── */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); }
    .stat-value { font-weight: 700; color: var(--text); }
    .stat-divider {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      min-width: 140px;
    }
    .tt-state {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }
    .tt-ae { color: var(--text-muted); font-size: 12px; }
    .tt-change { margin-top: 7px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
    .tt-change.add    { background: var(--green-dim); color: var(--accent); }
    .tt-change.change { background: var(--amber-dim); color: var(--accent-3); }
  </style>
</head>
<body>

<div class="ambient"></div>

<div class="page">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-mark">
        <!-- Findigs-style leaf/sprout icon -->
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 2C5.5 2 3 4.5 3 8c0 2.5 1.5 4.5 3.5 5.5V16h5v-2.5C13.5 12.5 15 10.5 15 8c0-3.5-2.5-6-6-6z" fill="#212b14"/>
          <path d="M9 6v10M6.5 8.5C7.5 7.5 8.5 7 9 7" stroke="#212b14" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="header-title">AE Territory Map</div>
        <div class="header-sub">Account Executive assignments by state</div>
      </div>
    </div>
    <div class="toggle-group">
      <button class="toggle-btn active" id="btn-smb" onclick="setView('smb', this)">SMB</button>
      <button class="toggle-btn" id="btn-mm" onclick="setView('mm_ent', this)">MM + ENT</button>
    </div>
  </header>

  <!-- Main -->
  <div class="main">
    <!-- Map -->
    <div class="map-card">
      <div class="map-card-header">
        <div>
          <div class="map-card-title" id="map-title">SMB Territory Coverage</div>
          <div class="map-card-sub" id="map-sub">Hover over any state to see AE details</div>
        </div>
        <div class="new-state-badge" id="new-badge">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <rect x="1" y="1" width="8" height="8" rx="1" stroke="#9BFF6A" stroke-width="1.5" stroke-dasharray="2,1.5" fill="none"/>
          </svg>
          Dashed = new territory
        </div>
      </div>
      <svg id="map" viewBox="0 0 960 620"></svg>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Legend -->
      <div class="card">
        <div class="card-title" id="legend-title">SMB AEs</div>
        <div id="legend-items"></div>
      </div>

      <!-- Coverage stats -->
      <div class="card">
        <div class="card-title">Coverage</div>
        <div id="stats-content"></div>
      </div>

      <!-- SMB Changes -->
      <div class="card" id="changes-card">
        <div class="card-title">Territory Changes</div>
        <div class="change-row">
          <span class="change-label">New states</span>
          <span class="badge badge-add" id="count-add">—</span>
        </div>
        <div class="change-row">
          <span class="change-label">Reassigned</span>
          <span class="badge badge-change" id="count-change">—</span>
        </div>
        <div class="change-row">
          <span class="change-label">Unchanged</span>
          <span class="badge badge-keep" id="count-keep">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <div class="tt-state" id="tt-state"></div>
  <div class="tt-ae" id="tt-ae"></div>
  <div id="tt-change"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>

// ═══════════════════════════════════════════════════
// DATA — all 50 states + DC
// ═══════════════════════════════════════════════════
const stateData = {
  "Alabama":              { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Alaska":               { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "Arizona":              { smb: "Hayden", mm_ent: "Ben",   smbChange: "KEEP" },
  "Arkansas":             { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "California":           { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "Colorado":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Connecticut":          { smb: "Hayden", mm_ent: "Ben",   smbChange: "CHANGE" },
  "Delaware":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Florida":              { smb: "Reese",  mm_ent: "Clay",  smbChange: "KEEP" },
  "Georgia":              { smb: "Reese",  mm_ent: "Clay",  smbChange: "KEEP" },
  "Hawaii":               { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "Idaho":                { smb: "Hayden", mm_ent: "Ben",   smbChange: "KEEP" },
  "Illinois":             { smb: "Ian",    mm_ent: "Matt",  smbChange: "ADD" },
  "Indiana":              { smb: "Ian",    mm_ent: "Ben",   smbChange: "ADD" },
  "Iowa":                 { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Kansas":               { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Kentucky":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Louisiana":            { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Maine":                { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Maryland":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Massachusetts":        { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Michigan":             { smb: "Hayden", mm_ent: "Matt",  smbChange: "ADD" },
  "Minnesota":            { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Mississippi":          { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Missouri":             { smb: "Reese",  mm_ent: "Matt",  smbChange: "ADD" },
  "Montana":              { smb: "Hayden", mm_ent: "Ben",   smbChange: "KEEP" },
  "Nebraska":             { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Nevada":               { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "New Hampshire":        { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "New Jersey":           { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "New Mexico":           { smb: "Reese",  mm_ent: "Ben",   smbChange: "KEEP" },
  "New York":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "North Carolina":       { smb: "Reese",  mm_ent: "Clay",  smbChange: "KEEP" },
  "North Dakota":         { smb: "Reese",  mm_ent: "Clay",  smbChange: "ADD" },
  "Ohio":                 { smb: "Ian",    mm_ent: "Matt",  smbChange: "KEEP" },
  "Oklahoma":             { smb: "Reese",  mm_ent: "Ben",   smbChange: "ADD" },
  "Oregon":               { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "Pennsylvania":         { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Rhode Island":         { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "South Carolina":       { smb: "Reese",  mm_ent: "Clay",  smbChange: "KEEP" },
  "South Dakota":         { smb: "Hayden", mm_ent: "Clay",  smbChange: "ADD" },
  "Tennessee":            { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Texas":                { smb: "Reese",  mm_ent: "Ben",   smbChange: "KEEP" },
  "Utah":                 { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Vermont":              { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Virginia":             { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Washington":           { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "West Virginia":        { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
  "Wisconsin":            { smb: "Hayden", mm_ent: "Matt",  smbChange: "ADD" },
  "Wyoming":              { smb: "Hayden", mm_ent: "Matt",  smbChange: "KEEP" },
  "District of Columbia": { smb: "Ian",    mm_ent: "Ben",   smbChange: "KEEP" },
};

// ── AE colors — all from Findigs brand palette ──────
const smbColors = {
  "Reese":  "#9BFF6A",  // brand key-green
  "Hayden": "#ADD2FF",  // brand sky
  "Ian":    "#FFA27A",  // brand coral
};
const mmEntColors = {
  "Clay":  "#FFCE59",   // brand sun
  "Ben":   "#F3B3F1",   // brand berry
  "Matt":  "#7FE3C8",   // mint — complements the palette
};
const smbRoles  = { "Reese": "SMB1", "Hayden": "SMB2", "Ian": "SMB3" };
const mmRoles   = { "Clay": "MM1",   "Ben": "MM2",     "Matt": "MM3" };

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let currentView = 'smb';

// ── Helpers ──────────────────────────────────────────
function getColor(name) {
  const d = stateData[name];
  if (!d) return '#2c3720';
  return currentView === 'smb'
    ? (smbColors[d.smb]    || '#2c3720')
    : (mmEntColors[d.mm_ent] || '#2c3720');
}

function getAE(name) {
  const d = stateData[name];
  if (!d) return null;
  return currentView === 'smb' ? d.smb : d.mm_ent;
}

function countStates() {
  const counts = {};
  const key = currentView === 'smb' ? 'smb' : 'mm_ent';
  Object.values(stateData).forEach(d => {
    const ae = d[key];
    counts[ae] = (counts[ae] || 0) + 1;
  });
  return counts;
}

// ── Legend ───────────────────────────────────────────
function updateLegend() {
  const colors = currentView === 'smb' ? smbColors : mmEntColors;
  const roles  = currentView === 'smb' ? smbRoles  : mmRoles;
  const counts = countStates();

  document.getElementById('legend-title').textContent =
    currentView === 'smb' ? 'SMB AEs' : 'MM + ENT AEs';

  document.getElementById('legend-items').innerHTML = Object.entries(colors).map(([name, color]) => `
    <div class="legend-item">
      <div class="legend-swatch" style="background:${color};box-shadow:0 0 8px ${color}55;"></div>
      <div>
        <div class="legend-name">${name}</div>
        <div class="legend-role">${roles[name]}</div>
      </div>
      <div class="legend-count">${counts[name] || 0}</div>
    </div>`).join('');
}

// ── Stats ─────────────────────────────────────────────
function updateStats() {
  const counts = countStates();
  const aes = currentView === 'smb' ? Object.keys(smbColors) : Object.keys(mmEntColors);
  const total = Object.keys(stateData).length;
  const colors = currentView === 'smb' ? smbColors : mmEntColors;

  document.getElementById('stats-content').innerHTML =
    aes.map(ae => `
      <div class="stat-row">
        <span class="stat-label" style="display:flex;align-items:center;gap:6px;">
          <span style="width:7px;height:7px;border-radius:50%;background:${colors[ae]};display:inline-block;flex-shrink:0;box-shadow:0 0 5px ${colors[ae]}88;"></span>
          ${ae}
        </span>
        <span class="stat-value">${counts[ae] || 0}</span>
      </div>`).join('') +
    `<div class="stat-row stat-divider">
       <span class="stat-label" style="font-weight:600;color:var(--text-muted);">Total</span>
       <span class="stat-value">${total}</span>
     </div>`;
}

// ── Changes panel ──────────────────────────────────────
function updateChanges() {
  const card  = document.getElementById('changes-card');
  const badge = document.getElementById('new-badge');

  if (currentView === 'smb') {
    card.style.display  = 'block';
    badge.style.display = 'flex';
    const vals = Object.values(stateData);
    document.getElementById('count-add').textContent    = vals.filter(d => d.smbChange === 'ADD').length;
    document.getElementById('count-change').textContent = vals.filter(d => d.smbChange === 'CHANGE').length;
    document.getElementById('count-keep').textContent   = vals.filter(d => d.smbChange === 'KEEP').length;
  } else {
    card.style.display  = 'none';
    badge.style.display = 'none';
  }
}

// ── Map update ─────────────────────────────────────────
function updateMap() {
  d3.selectAll('.state')
    .transition().duration(300).ease(d3.easeCubicOut)
    .attr('fill', d => getColor(d.properties.name))
    .attr('stroke', d => {
      if (currentView !== 'smb') return 'rgba(21,26,15,0.6)';
      const s = stateData[d.properties.name];
      return (s && s.smbChange === 'ADD') ? 'rgba(155,255,106,0.8)' : 'rgba(21,26,15,0.6)';
    })
    .attr('stroke-width', d => {
      if (currentView !== 'smb') return 0.8;
      const s = stateData[d.properties.name];
      return (s && s.smbChange === 'ADD') ? 1.8 : 0.8;
    })
    .attr('stroke-dasharray', d => {
      if (currentView !== 'smb') return null;
      const s = stateData[d.properties.name];
      return (s && s.smbChange === 'ADD') ? '4,2.5' : null;
    });

  document.getElementById('map-title').textContent =
    currentView === 'smb' ? 'SMB Territory Coverage' : 'MM + ENT Territory Coverage';
}

// ── Set view ───────────────────────────────────────────
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateMap();
  updateLegend();
  updateStats();
  updateChanges();
}

// ═══════════════════════════════════════════════════
// BUILD MAP
// ═══════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
  const svg  = d3.select("#map");
  const proj = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);
  const path = d3.geoPath().projection(proj);
  const states = topojson.feature(us, us.objects.states);

  // State fills
  svg.selectAll('.state')
    .data(states.features)
    .join('path')
      .attr('class', 'state')
      .attr('d', path)
      .attr('fill', d => getColor(d.properties.name))
      .attr('stroke', d => {
        const s = stateData[d.properties.name];
        return (s && s.smbChange === 'ADD') ? 'rgba(155,255,106,0.8)' : 'rgba(21,26,15,0.6)';
      })
      .attr('stroke-width', d => {
        const s = stateData[d.properties.name];
        return (s && s.smbChange === 'ADD') ? 1.8 : 0.8;
      })
      .attr('stroke-dasharray', d => {
        const s = stateData[d.properties.name];
        return (s && s.smbChange === 'ADD') ? '4,2.5' : null;
      })
    .on('mousemove', (event, d) => {
      const name = d.properties.name;
      const ae   = getAE(name);
      const info = stateData[name];
      const roles = currentView === 'smb' ? smbRoles : mmRoles;

      document.getElementById('tt-state').textContent = name || '—';
      document.getElementById('tt-ae').textContent    = ae
        ? `${ae} · ${roles[ae] || ''}`
        : 'Unassigned';

      const ttChange = document.getElementById('tt-change');
      if (currentView === 'smb' && info) {
        if (info.smbChange === 'ADD') {
          ttChange.innerHTML = '<span class="tt-change add">✦ New territory</span>';
        } else if (info.smbChange === 'CHANGE') {
          ttChange.innerHTML = '<span class="tt-change change">⇄ Reassigned</span>';
        } else {
          ttChange.innerHTML = '';
        }
      } else {
        ttChange.innerHTML = '';
      }

      tooltip.style.opacity = '1';
      tooltip.style.left    = (event.clientX + 14) + 'px';
      tooltip.style.top     = (event.clientY - 52) + 'px';
    })
    .on('mouseleave', () => {
      tooltip.style.opacity = '0';
    });

  // Subtle state border mesh overlay
  svg.append('path')
    .datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b))
    .attr('fill', 'none')
    .attr('stroke', 'rgba(21,26,15,0.5)')
    .attr('stroke-width', 0.5)
    .attr('d', path)
    .style('pointer-events', 'none');

  // Initial UI
  updateLegend();
  updateStats();
  updateChanges();

}).catch(() => {
  document.querySelector('.map-card').innerHTML =
    `<div style="padding:60px;text-align:center;color:var(--text-muted);">
       <p style="font-size:16px;font-family:'Fraunces',serif;">⚠ Map data unavailable</p>
       <p style="font-size:12px;margin-top:8px;">Please open in a browser with internet access.</p>
     </div>`;
});
</script>
</body>
</html>
